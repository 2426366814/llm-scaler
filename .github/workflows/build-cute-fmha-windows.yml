name: Build omni_xpu_kernel CUTE FMHA (Windows)

on:
  workflow_dispatch:
    inputs:
      torch_version:
        description: 'PyTorch XPU version'
        type: choice
        required: true
        default: '2.13.0+xpu'
        options:
          - '2.12.0+xpu'
          - '2.13.0+xpu'
      python_version:
        description: 'Python version'
        type: choice
        required: true
        default: '3.13'
        options:
          - '3.12'
          - '3.13'
      oneapi_version:
        description: 'Intel oneAPI version'
        type: choice
        required: true
        default: '2026.1'
        options:
          - '2026.0'
          - '2026.1'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout llm-scaler
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: llm-scaler

      - name: Checkout sycl-tla (for CUTE FMHA)
        uses: actions/checkout@v4
        with:
          repository: intel/sycl-tla
          ref: 2fc09973bfdf15755090fcb0e3b6ad236408a992
          path: llm-scaler\third_party\sycl-tla

      - name: Install Intel oneAPI
        run: |
          wget -q https://registrationcenter-download.intel.com/akdlm/irc_nas/19600/w_oneapi-hpc-toolkit-p-2026.1.0.100_offline.exe -O oneapi-installer.exe
          .\oneapi-installer.exe --silent --eula accept --components compiler;dnnl --install-dir "C:\Program Files (x86)\Intel\oneAPI"

      - name: Checkout sycl-tla (for CUTE FMHA)
        uses: actions/checkout@v4
        with:
          repository: intel/sycl-tla
          ref: 2fc09973bfdf15755090fcb0e3b6ad236408a992
          path: llm-scaler\third_party\sycl-tla

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}
          cache: pip
          architecture: x64

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,]'

      - name: Install PyTorch XPU
        run: pip install torch==${{ github.event.inputs.torch_version }} --index-url https://download.pytorch.org/whl/xpu

      - name: Set up build environment
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" --force
          set "ONEDNNROOT=C:\Program Files (x86)\Intel\oneAPI\dnnl\latest"
          set "CUTLASS_SYCL_ROOT=%GITHUB_WORKSPACE%\llm-scaler\third_party\sycl-tla"
          set "OMNI_XPU_DEVICE=bmg"
          set "OMNI_XPU_REQUIRE_CUTE=1"
          set "OMNI_XPU_ENABLE_ONEDNN=1"

      - name: Build omni_xpu_kernel with CUTE FMHA
        working-directory: llm-scaler\omni\omni_xpu_kernel
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" --force
          python -m pip wheel . --no-build-isolation --no-deps -w wheelhouse
          dir wheelhouse\

      - name: Upload Windows wheels
        uses: actions/upload-artifact@v4
        with:
          name: omni_xpu_kernel-windows-py${{ github.event.inputs.python_version }}-${{ github.event.inputs.torch_version }}
          path: llm-scaler\omni\omni_xpu_kernel\wheelhouse\*.whl
          retention-days: 30